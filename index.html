<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SEMEJKA PLUS</title>

    <link rel="icon" type="image/jpeg" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6C63FF">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Семейка+">
    <link rel="apple-touch-icon" href="https://s10.iimage.su/s/09/th_gvMJ97Lx8OAzBYuHL1UHLtuA0yebaDQnB8Uie9Xwd.jpg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            height: 100dvh; height: 100vh; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .screen { display: none; height: 100%; width: 100%; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        #regScreen {
            background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%);
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 40px; padding: 45px 35px; max-width: 420px; width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.6);
            text-align: center; border: 1px solid rgba(255,255,255,0.5);
        }

        .logo-glass-container {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px auto;
            user-select: none;
        }
        .logo-glass-container svg { width: 100%; height: auto; display: block; }

        p { color: #635857; margin-bottom: 25px; font-size: 17px; font-weight: 600; opacity: 0.85; }
        input { width: 100%; padding: 18px 24px; font-size: 18px; border: 1px solid rgba(255,255,255,0.8); border-radius: 25px; margin-bottom: 15px; background: rgba(255,255,255,0.5); outline: none; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); color: #3A3A4A; }
        input:focus { border-color: #6C63FF; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 5px 15px rgba(0,0,0,0.1); }
        
        .username-container {
            width: 100%;
            margin-bottom: 5px;
        }

        .status-badge {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            display: none;
            padding: 6px 12px;
            border-radius: 12px;
            line-height: 1.4;
        }
        .status-badge.success { display: inline-block; background: rgba(46, 204, 113, 0.2); color: #1e7e34; margin-bottom: 15px; }
        .status-badge.error { display: inline-block; background: rgba(231, 76, 60, 0.2); color: #962d22; }

        .change-account-btn {
            background: none; border: none; color: #6C63FF; font-size: 14px; font-weight: 600; 
            cursor: pointer; text-decoration: underline; margin-top: 12px; display: none; box-shadow: none; width: auto; padding: 0;
        }
        .change-account-btn:hover { color: #4A42D0; transform: none; box-shadow: none; }

        button { width: 100%; padding: 18px; background: linear-gradient(135deg, #6C63FF, #8B82FF); color: white; border: none; border-radius: 25px; font-size: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(108,99,255,0.4); margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(108,99,255,0.5); }
        button:disabled { background: #B0B0B0; box-shadow: none; transform: none; }

        #chatScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #FEE0B7 0%, #FDD299 33%, #EB8680 66%, #E67D76 100%); display: none; flex-direction: column; width: 100%; height: 100%; }
        #chatScreen.active { display: flex; }

        .refresh-btn {
            position: absolute; top: 15px; right: 15px; z-index: 10;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.6); font-size: 22px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); color: #3A3A4A;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.9); transform: scale(1.05); }

        .messages {
            flex: 1 1 auto; overflow-y: auto; padding: 10px 20px;
            display: flex; flex-direction: column; gap: 14px;
            margin: 60px auto 0 auto; width: 100%; max-width: 800px; align-items: stretch;
        }

        .date-separator { display: flex; justify-content: center; align-items: center; margin: 10px 0; width: 100%; }
        .date-separator span { background: rgba(255,255,255,0.5); padding: 6px 18px; border-radius: 15px; font-size: 13px; color: #5A5A6A; border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.05); white-space: nowrap; }

        .msg { max-width: 75%; display: flex; flex-direction: column; position: relative; }
        .msg.sent { align-self: flex-end; align-items: flex-end; }
        .msg.received { align-self: flex-start; align-items: flex-start; }
        .msg.animate-in { animation: fadeInUp 0.3s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .msg-content { 
            display: flex; align-items: flex-end; gap: 6px; width: 100%; 
        }
        .sent .msg-content { flex-direction: row-reverse; }
        .received .msg-content { flex-direction: row; }

        .bubble {
            display: inline-block; padding: 14px 20px; border-radius: 22px; font-size: 17px; line-height: 1.5; word-wrap: break-word;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12); background: rgba(240,236,245,0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #3A3A4A; cursor: pointer; user-select: none; max-width: 100%; overflow-wrap: break-word; word-break: break-word; border: 1px solid rgba(255,255,255,0.6);
            will-change: transform;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .sent .bubble { border-bottom-right-radius: 8px; }
        .received .bubble { border-bottom-left-radius: 8px; }

        .name { font-size: 13px; font-weight: 600; margin-bottom: 4px; padding-left: 6px; color: #6A6A7A; cursor: pointer; user-select: none; transition: color 0.1s; }
        .name:hover { color: #6C63FF; }
        .sent .name { display: none; }
        
        .mention {
            color: #6C63FF;
            font-weight: 600;
            text-decoration: none;
            background: rgba(108, 99, 255, 0.1);
            padding: 2px 6px;
            border-radius: 8px;
            display: inline-block;
        }
        .mention:hover {
            background: rgba(108, 99, 255, 0.2);
            text-decoration: underline;
        }

        .msg-footer { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            margin-top: 4px; 
            width: 100%; 
        }
        .sent .msg-footer { justify-content: flex-end; }
        .received .msg-footer { justify-content: flex-start; }

        .time { font-size: 11px; color: #4A4A5A; padding: 3px 8px; display: inline-block; border-radius: 12px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 2px 6px rgba(0,0,0,0.08); white-space: nowrap; height: 21px; line-height: 13px; }

        .loading-spinner { display: none; justify-content: center; align-items: center; flex-direction: column; gap: 12px; padding: 40px; color: #6C63FF; font-size: 16px; width: 100%; }
        .loading-spinner.active { display: flex; }
        .spinner-circle { width: 40px; height: 40px; border: 4px solid rgba(108,99,255,0.2); border-top: 4px solid #6C63FF; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .reactions-container { display: flex; gap: 4px; align-items: center; }
        
        .reaction-badge { 
            background: rgba(255,255,255,0.5); 
            border: 1px solid rgba(255,255,255,0.6); 
            box-shadow: 0 2px 6px rgba(0,0,0,0.08); 
            border-radius: 12px; 
            padding: 3px 8px; 
            font-size: 11px; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
            cursor: pointer; 
            transition: 0.2s; 
            white-space: nowrap; 
            color: #4A4A5A;
            height: 21px;
            line-height: 13px;
        }
        .reaction-badge:hover { background: rgba(255,255,255,0.8); transform: scale(1.05); }
        .reaction-badge.active { background: rgba(108,99,255,0.25); border-color: #6C63FF; color: #3A3A4A; }

        .emoji-panel {
            display: none; position: absolute; bottom: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); padding: 12px; gap: 8px; z-index: 9999; margin-bottom: 8px; max-width: 260px; flex-direction: column; align-items: stretch; border: 1px solid rgba(108,99,255,0.2); width: max-content;
        }
        .sent .emoji-panel { left: auto; right: 0; transform: none; }
        .received .emoji-panel { left: 0; right: auto; transform: none; }
        .emoji-panel.open { display: flex; }

        .emoji-search-input {
            width: 100%; padding: 8px 12px; font-size: 14px; border: 1px solid #D0D0E0; border-radius: 12px; outline: none; transition: 0.2s; margin-bottom: 4px; font-family: inherit; background: rgba(255,255,255,0.8);
        }
        .emoji-search-input:focus { border-color: #6C63FF; box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }

        .quick-emojis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; justify-items: center; max-height: 120px; overflow-y: auto; padding-right: 2px; }
        .quick-emojis::-webkit-scrollbar { width: 4px; }
        .quick-emojis::-webkit-scrollbar-thumb { background: rgba(108,99,255,0.3); border-radius: 4px; }

        .emoji-option { font-size: 22px; cursor: pointer; transition: transform 0.1s; padding: 4px; user-select: none; }
        .emoji-option:hover { transform: scale(1.25); }
        .emoji-no-results { font-size: 13px; color: #8A8A9A; text-align: center; padding: 10px 0; grid-column: span 4; }

        .input-area {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); padding: 14px 20px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0 auto 10px auto; display: flex; gap: 12px; align-items: flex-end; border-radius: 35px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(255,255,255,0.8); border: 1px solid rgba(108,99,255,0.3); width: calc(100% - 20px); max-width: 800px;
        }
        .input-area textarea {
            flex: 1; margin: 0; border-radius: 25px; padding: 15px 22px; font-size: 17px; line-height: 1.4; border: 1px solid #D0D0E0; background: rgba(255,255,255,0.95); outline: none; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.08); resize: none; overflow-y: auto; font-family: inherit; min-height: 52px; max-height: 200px; scrollbar-width: none; -ms-overflow-style: none; max-width: 100%; word-wrap: break-word; word-break: break-word;
        }
        .input-area textarea::-webkit-scrollbar { display: none; }
        .input-area textarea:focus { border-color: #6C63FF; background: #FFFFFF; box-shadow: 0 0 0 4px rgba(108,99,255,0.2), 0 2px 8px rgba(0,0,0,0.1); }
        .input-area button { width: 52px; height: 52px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6C63FF, #8B82FF); box-shadow: 0 10px 20px rgba(108,99,255,0.4); border: none; flex-shrink: 0; }
        .input-area button:hover { transform: scale(1.05); }

        .bubble a { color: #6C63FF; text-decoration: underline; word-break: break-all; }
        .bubble a:hover { color: #4A42D0; }

        @media (max-width: 480px) {
            .emoji-panel { max-width: calc(100vw - 30px); }
            .messages { padding: 5px 10px; gap: 10px; margin-top: 50px; }
            .bubble { font-size: 15px; padding: 10px 14px; }
            .msg { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div id="regScreen" class="screen active">
        <div class="box">
            <div class="logo-glass-container">
                <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="liquidGlassEffect" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
                            <feOffset dx="0" dy="7" result="offsetBlur" />
                            <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.3" specularExponent="40" lighting-color="#ffffff" result="specOut">
                                <fePointLight x="-120" y="-140" z="180" />
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
                            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litOnOff" />
                            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#c94a42" flood-opacity="0.35"/>
                        </filter>
                        <linearGradient id="glassSemejka" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAE96" />
                            <stop offset="45%" stop-color="#F2796D" />
                            <stop offset="100%" stop-color="#C93D36" />
                        </linearGradient>
                        <linearGradient id="glassPlus" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFAA85" />
                            <stop offset="50%" stop-color="#ED5D52" />
                            <stop offset="100%" stop-color="#A61C17" />
                        </linearGradient>
                    </defs>
                    <g filter="url(#liquidGlassEffect)">
                        <text x="200" y="65" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', system-ui, sans-serif" font-weight="900" font-size="56" text-anchor="middle" letter-spacing="3" fill="url(#glassSemejka)">SEMEJKA</text>
                        <text x="200" y="138" font-family="'Arial Rounded MT Bold', 'Comic Sans MS', system-ui, sans-serif" font-weight="900" font-size="62" text-anchor="middle" letter-spacing="4" fill="url(#glassPlus)">PLUS</text>
                    </g>
                </svg>
            </div>
            <p id="subTitleText">Семейный чат для самых близких</p>
            
            <input type="text" id="nameInput" placeholder="Ваше имя">
            
            <div id="statusBadge" class="status-badge"></div>

            <div id="usernameWrapper" class="username-container">
                <input type="text" id="usernameInput" placeholder="Придумайте уникальный тег (напр. @alex)">
            </div>

            <button id="joinBtn">Войти в чат</button>
            <button id="changeAccountBtn" class="change-account-btn">Войти под другим именем</button>
        </div>
    </div>

    <div id="chatScreen" class="screen">
        <button class="refresh-btn" id="refreshBtn" title="Обновить чат">🔄</button>
        <div class="messages" id="messages">
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-circle"></div>
                <span>Загрузка сообщений...</span>
            </div>
        </div>
        <div class="input-area">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
            <button id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/></svg>
            </button>
        </div>
    </div>

    <script>
        const HF_SPACE_DOMAIN = 'mrkricalo-semejka-plus-chat.hf.space'; 
        
        const API_URL = `https://${HF_SPACE_DOMAIN}`;
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        
        // ВАЖНО: Выносим инициализацию WS_URL в функцию, чтобы прикреплять сохраненный apikey динамически
        function getWsUrl() {
            const saved = localStorage.getItem('semejka_user');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.apikey) {
                        // Явно передаем apikey в параметрах URL сокета для прокси-сервера
                        return `${WS_PROTOCOL}//${HF_SPACE_DOMAIN}/ws?apikey=${encodeURIComponent(parsed.apikey)}`;
                    }
                } catch(e) {}
            }
            return `${WS_PROTOCOL}//${HF_SPACE_DOMAIN}/ws`;
        }

        const regScreen = document.getElementById('regScreen');
        const chatScreen = document.getElementById('chatScreen');
        const nameInput = document.getElementById('nameInput');
        const usernameInput = document.getElementById('usernameInput'); 
        const usernameWrapper = document.getElementById('usernameWrapper');
        const statusBadge = document.getElementById('statusBadge');
        const joinBtn = document.getElementById('joinBtn');
        const changeAccountBtn = document.getElementById('changeAccountBtn');
        const subTitleText = document.getElementById('subTitleText');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        let currentUser = null;
        let lastDisplayedDate = null;
        let longPressTimer = null;
        let socket = null;
        let cachedAutoProfile = null;

        function autoResize() {
            msgInput.style.height = 'auto';
            const scrollHeight = msgInput.scrollHeight;
            if (scrollHeight > 200) {
                msgInput.style.height = '200px';
                msgInput.style.overflowY = 'auto';
            } else {
                msgInput.style.height = scrollHeight + 'px';
                msgInput.style.overflowY = 'hidden';
            }
        }
        msgInput.addEventListener('input', autoResize);

        function resetTextarea() {
            msgInput.value = '';
            msgInput.style.height = 'auto';
            msgInput.style.overflowY = 'hidden';
        }

        function logout() {
            localStorage.removeItem('semejka_user');
            if (socket) { socket.close(); socket = null; }
            currentUser = null; lastDisplayedDate = null;
            cachedAutoProfile = null;
            
            statusBadge.className = 'status-badge';
            statusBadge.style.display = 'none';
            changeAccountBtn.style.display = 'none';
            nameInput.style.display = 'block';
            subTitleText.textContent = 'Семейный чат для самых близких';
            
            regScreen.classList.add('active');
            chatScreen.classList.remove('active');
            nameInput.value = '';
            usernameInput.value = '';
            joinBtn.textContent = 'Войти в чат';
            resetTextarea();
        }

        const EMOJI_DATABASE = [
            { emoji: '👍', tags: ['класс', 'круто', 'да', 'лайк', 'хорошо', 'ок', 'согласен'] },

            { emoji: '📚', tags: ['учеба', 'книга', 'школа', 'урок', 'домашшка', 'универ', 'читать'] },
            { emoji: '💻', tags: ['компьютер', 'ноутбук', 'работа', 'прога', 'сижу', 'код'] },
            { emoji: '📱', tags: ['телефон', 'смартфон', 'звони', 'пиши', 'связь', 'мобильный'] },
            { emoji: '📷', tags: ['фото', 'камера', 'фотка', 'снимок', 'инста', 'видео'] },
            { emoji: '🎧', tags: ['наушники', 'музыка', 'песня', 'трек', 'слушаю', 'звук'] },
            { emoji: '🏃', tags: ['бегу', 'бег', 'опаздываю', 'спорт', 'спешу', 'иду'] },
            { emoji: '😴', tags: ['сплю', 'сон', 'устал', 'ночь', 'спать', 'отбой', 'вырубаюсь'] },
            { emoji: '🏠', tags: ['дом', 'дома', 'домой', 'здание', 'квартира', 'семья'] },
            { emoji: '💰', tags: ['деньги', 'кэш', 'зарплата', 'купил', 'дорого', 'богатый'] }
        ];

        function addLongPressListeners(msgElement, messageId) {
            const bubble = msgElement.querySelector('.bubble');
            if (!bubble) return;
            const startPress = (e) => { if (!e.target.closest('a') && !e.target.closest('.mention')) longPressTimer = setTimeout(() => showEmojiPanel(messageId), 300); };
            const cancelPress = () => { clearTimeout(longPressTimer); };
            bubble.addEventListener('mousedown', startPress);
            bubble.addEventListener('mouseup', cancelPress);
            bubble.addEventListener('mouseleave', cancelPress);
            bubble.addEventListener('touchstart', startPress, { passive: true });
            bubble.addEventListener('touchend', cancelPress);
        }

        function showEmojiPanel(messageId) {
            const msgEl = document.getElementById('msg-' + messageId);
            if (!msgEl) return;
            document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open'));
            
            let panel = msgEl.querySelector('.emoji-panel');
            if (!panel) {
                panel = document.createElement('div'); panel.className = 'emoji-panel';
                
                const searchInput = document.createElement('input');
                searchInput.type = 'text'; searchInput.className = 'emoji-search-input';
                searchInput.placeholder = 'Поиск реакции...';
                
                const quickContainer = document.createElement('div'); quickContainer.className = 'quick-emojis';
                
                const filterEmojis = (query) => {
                    quickContainer.innerHTML = '';
                    const cleanQuery = query.toLowerCase().trim();
                    const filtered = EMOJI_DATABASE.filter(item => !cleanQuery || item.tags.some(t => t.includes(cleanQuery)));
                    
                    if (filtered.length === 0) {
                        const noResults = document.createElement('div'); noResults.className = 'emoji-no-results';
                        noResults.textContent = 'Ничего не найдено 🔍'; quickContainer.appendChild(noResults); return;
                    }
                    
                    filtered.forEach(item => {
                        const span = document.createElement('span'); span.className = 'emoji-option'; span.textContent = item.emoji;
                        span.onclick = async (e) => { 
                            e.stopPropagation(); 
                            panel.classList.remove('open'); 
                            await toggleReaction(messageId, item.emoji);
                        };
                        quickContainer.appendChild(span);
                    });
                };
                
                searchInput.addEventListener('input', (e) => filterEmojis(e.target.value));
                filterEmojis('');
                
                panel.appendChild(searchInput);
                panel.appendChild(quickContainer);
                msgEl.appendChild(panel);
                panel.onclick = (e) => e.stopPropagation();
            }
            panel.classList.add('open');
            setTimeout(() => {
                const input = panel.querySelector('.emoji-search-input');
                if (input) { input.value = ''; filterEmojis(''); input.focus(); }
            }, 50);
        }

        async function toggleReaction(messageId, emoji) {
            if (!currentUser) return;
            try {
                await fetch(`${API_URL}/messages/${messageId}/reactions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        emoji: emoji
                    })
                });
            } catch (err) {
                console.error('Ошибка отправки реакции:', err);
            }
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.emoji-panel') && !e.target.closest('.bubble')) {
                document.querySelectorAll('.emoji-panel.open').forEach(p => p.classList.remove('open'));
            }
        });

        function linkify(text) {
            const urlRegex = /(https?:\/\/[^\s<]+)/gi;
            let processed = text.replace(urlRegex, (url) => `<a href="${url.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">${url}</a>`);
            
            const mentionRegex = /(@[a-zA-Z0-9_]+)/g;
            processed = processed.replace(mentionRegex, (mention) => `<span class="mention" ondblclick="insertMention('${mention} ')" style="cursor: pointer;">${mention}</span>`);
            
            return processed;
        }

        window.insertMention = function(mentionText) {
            msgInput.value += mentionText;
            msgInput.focus();
            autoResize();
        };

        function renderReactions(msgEl, reactionsList, messageId) {
            const footer = msgEl.querySelector('.msg-footer');
            if (!footer) return;

            if (!reactionsList || reactionsList.length === 0) {
                let container = footer.querySelector('.reactions-container');
                if (container) container.remove();
                return;
            }

            let container = footer.querySelector('.reactions-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'reactions-container';
                
                if (msgEl.classList.contains('sent')) {
                    footer.insertBefore(container, footer.firstChild);
                } else {
                    footer.appendChild(container);
                }
            }
            container.innerHTML = '';

            const counts = {};
            const userReacted = {};

            reactionsList.forEach(r => {
                counts[r.emoji] = (counts[r.emoji] || 0) + 1;
                if (currentUser && String(r.user_id) === String(currentUser.id)) {
                    userReacted[r.emoji] = true;
                }
            });

            Object.keys(counts).forEach(emoji => {
                const badge = document.createElement('div');
                badge.className = 'reaction-badge' + (userReacted[emoji] ? ' active' : '');
                badge.innerHTML = `<span>${emoji}</span> <span>${counts[emoji]}</span>`;
                badge.onclick = async (e) => {
                    e.stopPropagation();
                    await toggleReaction(messageId, emoji);
                };
                container.appendChild(badge);
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function formatTime(isoString) {
            try {
                const d = new Date(isoString);
                return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            } catch(e) { return ''; }
        }

        function insertDateSeparator(isoString) {
            const d = new Date(isoString);
            const text = d.toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const sep = document.createElement('div');
            sep.className = 'date-separator';
            sep.innerHTML = `<span>${text}</span>`;
            messagesDiv.appendChild(sep);
        }

        function renderMessage(msg, animate = false) {
            let div = document.getElementById('msg-' + msg.id);
            
            if (div) {
                renderReactions(div, msg.reactions, msg.id);
                return;
            }
            
            const msgDate = new Date(msg.created_at || Date.now()).toLocaleDateString('ru-RU');
            if (msgDate !== lastDisplayedDate) { 
                insertDateSeparator(msg.created_at || new Date().toISOString()); 
                lastDisplayedDate = msgDate; 
            }

            div = document.createElement('div');
            div.id = 'msg-' + msg.id; 
            div.className = 'msg ' + (msg.user_id === currentUser?.id ? 'sent' : 'received');

            let html = '';
            let displayName = msg.user_name || '';
            let searchTag = '';
            
            if (displayName.includes('||')) {
                const parts = displayName.split('||');
                displayName = parts[0];
                searchTag = parts[1];
            }

            if (msg.user_id !== currentUser?.id) {
                const mentionPayload = searchTag ? searchTag : '@' + displayName;
                html += `<div class="name" ondblclick="insertMention('${mentionPayload} ')" title="Двойной клик для упоминания">${escapeHtml(displayName)} <span style="font-size:11px; font-weight:normal; opacity:0.6;">${escapeHtml(searchTag)}</span></div>`;
            }
            html += `<div class="msg-content"><div class="bubble">${linkify(escapeHtml(msg.text || ''))}</div></div>`;
            html += `<div class="msg-footer"><div class="time">${formatTime(msg.created_at || new Date().toISOString())}</div></div>`;

            div.innerHTML = html; 
            messagesDiv.appendChild(div);
            
            renderReactions(div, msg.reactions, msg.id);
            addLongPressListeners(div, msg.id);
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Измененная функция инициализации Realtime-подключения
        function initRealtime() {
            if (socket) { try { socket.close(); } catch(e){} }

            // Вызываем динамическое получение URL со встроенным апи-ключом
            const currentWsUrl = getWsUrl();
            socket = new WebSocket(currentWsUrl);

            socket.onopen = () => {
                console.log('Подключено к прокси Realtime!');
                // Каждые 25 секунд шлем хартбит, чтобы соединение не висло
                setInterval(() => {
                    if(socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ event: "heartbeat", topic: "phoenix", payload: {}, ref: null }));
                    }
                }, 25000);
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.event === "postgres_changes" && data.payload && data.payload.data) {
                        loadMessages(); // При любых изменениях обновляем чат
                    }
                } catch(e) {}
            };

            socket.onerror = (err) => { console.error('Ошибка сокета:', err); };
            socket.onclose = () => { console.log('Сокет закрыт. Реконнект через 4 сек...'); setTimeout(initRealtime, 4000); };
        }

        async function loadMessages() {
            if (!currentUser) return;
            loadingSpinner.classList.add('active');
            try {
                const res = await fetch(`${API_URL}/messages?order=created_at.asc`, {
                    headers: { 'apikey': currentUser.apikey, 'Authorization': `Bearer ${currentUser.apikey}` }
                });
                if (!res.ok) throw new Error('Ошибка сети');
                const list = await res.json();
                
                const oldScroll = messagesDiv.scrollHeight - messagesDiv.scrollTop;
                
                // Очищаем и заново рендерим, чтобы избежать дублей
                const spinners = loadingSpinner.outerHTML;
                messagesDiv.innerHTML = spinners;
                lastDisplayedDate = null;
                
                list.forEach(m => renderMessage(m));
                
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            } catch (err) {
                console.error(err);
            } finally {
                loadingSpinner.classList.remove('active');
            }
        }

        // Полноценный вход в систему
        async function handleLogin(name, tag, customKey) {
            const finalTag = tag.startsWith('@') ? tag : '@' + tag;
            const payload = { id: Date.now(), name: name, tag: finalTag, apikey: customKey };
            
            localStorage.setItem('semejka_user', JSON.stringify(payload));
            currentUser = payload;
            
            regScreen.classList.remove('active');
            chatScreen.classList.add('active');
            
            await loadMessages();
            initRealtime(); // Запускаем вебсокет уже после сохранения сессии
        }

        // Кнопка входа
        joinBtn.onclick = async () => {
            const name = nameInput.value.trim();
            const tag = usernameInput.value.trim();
            // Сюда можно добавить статический или динамический ключ
            const defaultKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmc3hmbHNidWV5b3Rpa3NxY25wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTg1NjM0MDAsImV4cCI6MjAzNDE1OTQwMH0.your-key-here"; 

            if(!name || !tag) return alert('Заполните все поля!');
            await handleLogin(name, tag, defaultKey);
        };

        refreshBtn.onclick = loadMessages;

        // Авто-логин при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('semejka_user');
            if(saved) {
                try {
                    currentUser = JSON.parse(saved);
                    regScreen.classList.remove('active');
                    chatScreen.classList.add('active');
                    loadMessages();
                    initRealtime();
                } catch(e) { logout(); }
            }
        });
    </script>
